---
# cPanel Git™ Version Control deployment.
#
# The real work lives in scripts/publish.sh so that this file and the cron
# deploy share one definition of what gets published. This hook only exists
# so cPanel's "Deploy HEAD Commit" button keeps working; the cron path does
# not need cPanel's Git panel at all.
#
# NOTE: change DEPLOYPATH in publish.sh if kocsisagnes.hu is an addon domain
# rather than the account's primary domain.
deployment:
  tasks:
    - /bin/bash scripts/publish.sh
